      summary: 'A pending referral credit was given another way (refund, Razorpay offer ...): mark it applied (audited)'
      parameters:
        - { name: publicId, in: path, required: true, schema: { type: string } }
        - { name: rewardId, in: path, required: true, schema: { type: integer } }
