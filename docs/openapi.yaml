    get:
      tags: [Directory (app)]
      summary: 'The DineDesk app''s "Find a restaurant or hotel": live, published businesses (branches too), real ones first and demos last (60 per minute per IP)'
      description: 'Only on the platform host: a business website gets 404. Businesses that opted out (PUT /tenant/website/directory) are left out. Sorted by name.'
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 80 }, description: name or city }
        - { name: city, in: query, schema: { type: string, maxLength: 80 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        '200':
          description: '20 per page; meta = { current_page, last_page, per_page, total }'
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DirectoryPlace' } } } }
        '404': { description: '`not_found` on a business host' }
  /directory/place:
    get:
      tags: [Directory (app)]
      summary: 'A scanned QR code or typed address: is this host a live DineDesk place? (opted-out businesses still open from their own QR codes)'
      parameters:
        - { name: host, in: query, required: true, schema: { type: string, maxLength: 253 }, example: the-hungry-haveli.dinedesk.in }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryPlace' } } } }
        '404': { description: '`not_a_place`' }
  /devices:
    post:
      tags: [Account]
      security: [{ bearer: [] }]
      summary: 'Register this phone for app notifications (DineDesk Android app, Firebase Cloud Messaging): anyone signed in, never in a support session'
      description: 'Sent by the web app inside the app after sign-in, on start with a session and when Firebase gives a new token. Upsert by token: a token already registered moves to the person signed in now. Signing out (POST /auth/logout) removes devices registered with that sign-in.'
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string, pattern: '^[A-Za-z0-9_:.\-]{20,512}$' }, app_version: { type: string, maxLength: 32 }, flavor: { type: string, enum: [dev, prod] } } }
      responses:
        '200': { description: '{ devices } (how many phones this person has)' }
        '403': { description: '`support_session`' }
        '422': { description: Validation error }
  /devices/{token}:
    delete:
      tags: [Account]
      security: [{ bearer: [] }]
      summary: 'Remove this phone from the person''s app notifications (own devices only; sign-out)'
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Removed (or not one of yours) }
  /account:
    patch:
      tags: [Account]
      security: [{ bearer: [] }]
      summary: 'My account (anyone signed in: owner, staff or super admin): name, email, dashboard language'
      description: 'User-level, so it works in any business status. Changing or removing the email needs `current_password` (accounts made by mobile have no password yet); the email can''t be removed while it is the only way to sign in. Audited (`account.updated`).'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                email: { type: [string, 'null'], format: email, maxLength: 150 }
                locale: { type: string, enum: [en, hi, bn, mr, te, ta, gu, ur, kn, or, ml, pa], description: 'Dashboard language; staff alerts and owner messages use it too' }
                current_password: { type: [string, 'null'] }
      responses:
        '200': { description: 'The new session', content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '403': { description: '`support_session`: a super admin can''t change their own account from inside a business' }
        '422': { description: '`wrong_password` (errors.current_password), `email_required`, email already used' }
  /account/password:
    put:
      tags: [Account]
      security: [{ bearer: [] }]
      summary: Change the password (or set one after signing up by mobile); signs out every other device
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [password, password_confirmation]
              properties:
                current_password: { type: [string, 'null'], description: required when the account has a password }
                password: { type: string, description: 8+ chars with letters and numbers }
                password_confirmation: { type: string }
      responses:
        '200': { description: The new session (this device stays signed in) }
        '403': { description: '`support_session`' }
        '422': { description: '`wrong_password` or validation' }
  /account/phone/code:
    post:
      tags: [Account]
      security: [{ bearer: [] }]
      summary: 'Add or change the mobile number, step 1: a 6-digit code by SMS (same limits as /auth/otp/send)'
      requestBody: { content: { application/json: { schema: { type: object, required: [phone], properties: { phone: { type: string, example: '98290 12345' } } } } } }
      responses:
        '200': { description: '{ expires_in, resend_in, dev_code? }' }
        '422': { description: '`phone_unchanged` (already your verified number) or `phone_taken`' }
        '429': { description: '`otp_wait` or rate limited' }
  /account/phone/verify:
    post:
      tags: [Account]
      security: [{ bearer: [] }]
      summary: 'Step 2: the code saves the number as verified (audited `account.phone_changed`)'
      requestBody: { content: { application/json: { schema: { type: object, required: [phone, code], properties: { phone: { type: string }, code: { type: string, example: '482913' } } } } } }
      responses:
        '200': { description: The new session }
        '422': { description: '`otp_invalid`, `phone_taken` or `phone_unchanged`' }
        '429': { description: '`otp_locked`' }
  /tenant/alerts:
    get:
      tags: [Alerts (dashboard)]
      security: [{ bearer: [] }]
      summary: 'In-app alerts for the signed-in person in this business: their unread ones, newest first (max 10)'
      description: 'Only the kinds the dashboard lists (now `referral.reward`: a business that signed up with your link started paying). The server stores plain values; the dashboard writes the text in the reader''s language. Orders, bookings and stock have their own screens and sounds.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    kind: { type: string, enum: [referral.reward] }
                    data: { type: object, description: 'referral.reward: { business, days, status: granted | pending, until (date-time, when granted) }' }
                    created_at: { type: string, format: date-time }
  /tenant/alerts/{id}/read:
    post:
      tags: [Alerts (dashboard)]
      security: [{ bearer: [] }]
      summary: Dismiss one alert (works while read-only; someone else's id does nothing)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: OK }
