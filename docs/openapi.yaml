openapi: 3.1.0
info:
  title: DineDesk API
  version: 1.0.0-phase3
  description: |
    Multi-tenant restaurant & hotel platform. All endpoints live under `/api/v1`.

    **Envelope.** Every response is `{ data, message, errors, meta }`. Errors carry a stable
    `meta.code` (e.g. `validation`, `unauthenticated`, `forbidden`, `tenant_not_found`,
    `tenant_mismatch`, `onboarding_required`, `plan_limit`, `feature_unavailable`,
    `tenant_suspended`, `tenant_read_only`, `otp_invalid`, `otp_locked`, `otp_wait`, `throttled`,
    `already_live`, `steps_incomplete`, `slug_unavailable`, `gallery_full`, `invalid_ids`,
    ordering: `not_accepting`, `type_unavailable`, `payment_method_unavailable`, `closed_now`, `closed_then`,
    `too_soon`, `too_far`, `outside_delivery_area`, `below_minimum`, `item_missing`, `item_unavailable`,
    `variant_required`, `addons_required`, `addons_too_many`, `invalid_addon`, `payment_unverified`,
    `invalid_transition`, `awaiting_payment`, `reason_required`; menu: `category_not_empty`, `import_invalid`, `plan_limit`).

    **Money.** Amounts are strings with 2 decimals (rupees). The server prices every order from the
    menu (item → variant → add-ons, GST per line: dish → section → business default, rounded per line);
    clients send ids and quantities only.

    **SEO files.** `GET /robots.txt` and `GET /sitemap.xml` (web routes, not under /api) are per business,
    chosen by host. Unpublished, demo and suspended sites are `Disallow: /` and have no sitemap.

    **Tenancy.** Public website endpoints resolve the business from the host the visitor is on.
    Browsers send it in `X-Tenant-Host` (the SPA always does); otherwise the request `Host` is used.
    Dashboard endpoints (`/tenant/*`) always act on the signed-in user's own business.

    **Auth.** Sanctum bearer tokens: `Authorization: Bearer <token>`.

    **Language.** The SPA sends the language the person is using in `X-Locale` (`ta`, `bn-IN` ...;
    see the `Locale` parameter). It is optional on every request and only read where a message is
    sent or an account is made: guest orders, table / room / tiffin bookings and banquet enquiries
    (their SMS / WhatsApp / email updates), sign-up (the account's language) and adding a staff
    member (their first language). Unknown or missing values mean English. Staff alerts and
    owner messages use each recipient's own account language.
servers:
  - url: http://localhost:8010/api/v1
    description: Local development
tags:
  - name: Auth
  - name: Onboarding
  - name: Public site
  - name: Business (dashboard)
  - name: Website (dashboard)
  - name: Ordering (public)
  - name: Orders (dashboard)
  - name: Menu (dashboard)
  - name: Reservations (public)
  - name: Reservations (dashboard)
  - name: Table ordering (public)
  - name: Tables (dashboard)
  - name: Kitchen (dashboard)
  - name: POS (dashboard)
  - name: Live updates
  - name: Plans
  - name: Platform (super admin)
  - name: Account
  - name: Referrals
  - name: Directory (app)
  - name: Alerts (dashboard)
  - name: Riders (dashboard)
  - name: Rider (phone)
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    TenantHost:
      name: X-Tenant-Host
      in: header
      required: false
      description: Host of the page the visitor is on, e.g. `haveli-demo.localhost:5173`.
      schema: { type: string }
    Locale:
      name: X-Locale
      in: header
      required: false
      description: 'Language of the person sending the request: one of en hi bn mr te ta gu ur kn or ml pa, a region suffix is ignored (`bn-IN` → `bn`). Anything else is English.'
      schema: { type: string, example: ta }
  schemas:
    Subscription:
      type: [object, 'null']
      description: |
        The business's current subscription (a branch shows its main business's).
        trialing → (trial ends) past_due + grace → read-only;
        pending (checkout started) → active → (renewal) active;
        during a trial: pending → scheduled (authorised, first charge when the trial ends) → active.
      properties:
        status: { type: string, enum: [trialing, pending, scheduled, active, past_due, halted, cancelled, expired] }
        plan: { type: object, properties: { code: { type: string }, name: { type: string } } }
        billing_cycle: { type: [string, 'null'], enum: [monthly, yearly, null] }
        trial_ends_at: { type: [string, 'null'], format: date-time }
        starts_at: { type: [string, 'null'], format: date-time, description: 'Only while `scheduled`: when the first charge (and the paid plan) starts — the end of the trial' }
        current_period_ends_at: { type: [string, 'null'], format: date-time }
        grace_ends_at: { type: [string, 'null'], format: date-time }
        cancel_at_period_end: { type: boolean }
        scheduled_plan: { type: [object, 'null'], description: 'A downgrade / cycle change waiting for the next period: { code, name }' }
        paid: { type: boolean }
    DirectoryPlace:
      type: object
      description: Only what the business's own public website already shows.
      properties:
        name: { type: string }
        slug: { type: string }
        host: { type: string, example: the-hungry-haveli.dinedesk.in, description: 'primary custom domain, else the subdomain' }
        url: { type: string, example: 'https://the-hungry-haveli.dinedesk.in' }
        business_type: { type: string, enum: [restaurant, cafe, cloud_kitchen, hotel] }
        city: { type: [string, 'null'] }
        logo: { type: [object, 'null'], description: '{ src, srcset, width, height }' }
        cover: { type: [object, 'null'], description: '{ src, srcset, width, height }' }
        is_open: { type: [boolean, 'null'], description: 'Open right now (opening hours and holidays, business timezone); null when no hours are set' }
        is_demo: { type: boolean }
    TranslationEntry:
      type: object
      description: One text of the owner's in another site language.
      properties:
        key: { type: string, example: 'item:12:name', description: '<type>:<id or position>:<field>' }
        group: { type: string, enum: [menu, rooms, banners, website] }
        type: { type: string, enum: [category, item, variant, group, addon, room, banner, site, milestone, seo] }
        field: { type: string, enum: [name, description, title, text, tagline, about] }
        label: { type: [string, 'null'], description: 'Context: the section of a dish, the dish of a size, the group of an add-on, the year of a milestone' }
        source: { type: string, description: The English text }
        hi: { type: [string, 'null'], description: 'The Hindi text, when there is one' }
        value: { type: string, description: 'The text in this language ("" = not translated yet)' }
        max: { type: integer, description: Longest allowed text }
    Envelope:
      type: object
      properties:
        data: {}
        message: { type: [string, 'null'] }
        errors:
          type: [object, 'null']
          additionalProperties: { type: array, items: { type: string } }
        meta: { type: [object, 'null'] }
    OpeningHours:
      type: object
      description: Keys mon..sun. A close time at or before the open time means past midnight.
      additionalProperties:
        type: object
        properties:
          closed: { type: boolean }
          open: { type: [string, 'null'], example: '11:00' }
          close: { type: [string, 'null'], example: '23:00' }
    Session:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: [string, 'null'] }
            phone: { type: [string, 'null'], example: '+919829012345' }
            locale: { type: string }
            is_platform_admin: { type: boolean }
        tenant:
          type: [object, 'null']
          properties:
            id: { type: string, description: Public ULID }
            name: { type: string }
            slug: { type: string }
            business_type: { type: string, enum: [restaurant, cafe, cloud_kitchen, hotel] }
            city: { type: string }
            status: { type: string, enum: [onboarding, live, suspended, read_only] }
            onboarding_step: { type: integer }
            is_demo: { type: boolean }
            site_host: { type: string, example: the-hungry-haveli.dinedesk.in }
            plan: { type: object, properties: { code: { type: string }, name: { type: string } } }
            subscription:
              type: [object, 'null']
              properties:
                status: { type: string, description: 'See Subscription; `scheduled` = a plan paid for during the trial, starting when the trial ends' }
                trial_ends_at: { type: [string, 'null'], format: date-time }
                grace_ends_at: { type: [string, 'null'], format: date-time }
                current_period_ends_at: { type: [string, 'null'], format: date-time }
                cancel_at_period_end: { type: boolean }
        role: { type: [string, 'null'], enum: [owner, manager, cashier, waiter, kitchen, front_desk, null] }
        permissions: { type: array, items: { type: string } }
        features: { type: object, additionalProperties: { type: boolean } }
        limits: { type: object, additionalProperties: { type: [integer, 'null'] } }
        next: { type: string, enum: [onboarding, dashboard, platform] }
    Image:
      type: [object, 'null']
      description: Uploaded image, converted to WebP (480/960/1600 px, never upscaled) with a blur placeholder.
      properties:
        src: { type: string }
        srcset: { type: string, example: '/storage/tenants/01J…/gallery/01J…-480.webp 480w, …' }
        width: { type: integer }
        height: { type: integer }
        placeholder: { type: [string, 'null'], description: tiny base64 WebP }
    Holiday:
      type: object
      properties:
        date: { type: string, format: date }
        label: { type: [string, 'null'], example: Diwali }
    Sections:
      type: array
      description: Home page sections in display order (the hero is always first and not listed).
      items:
        type: object
        properties:
          key: { type: string, enum: [specials, story, menu_preview, gallery, hours, visit] }
          visible: { type: boolean }
    ThemeSettings:
      type: object
      properties:
        key: { type: string, enum: [haveli, bistro, street] }
        primary_color: { type: [string, 'null'], example: '#641E16', description: null = theme default }
        accent_color: { type: [string, 'null'] }
        logo: { $ref: '#/components/schemas/Image' }
        cover: { $ref: '#/components/schemas/Image' }
        sections: { $ref: '#/components/schemas/Sections' }
    SiteContent:
      type: object
      description: Owner-written text. Empty fields are null and simply not shown; nothing is ever generated.
      properties:
        tagline: { type: [string, 'null'] }
        tagline_hi: { type: [string, 'null'] }
        about: { type: [string, 'null'] }
        about_hi: { type: [string, 'null'] }
        milestones:
          type: array
          items: { type: object, properties: { year: { type: string }, title: { type: string }, title_hi: { type: [string, 'null'] }, text: { type: [string, 'null'] }, text_hi: { type: [string, 'null'] } } }
        contact:
          type: object
          properties:
            phone: { type: [string, 'null'] }
            whatsapp: { type: [string, 'null'], description: 'Public endpoints return it only once the owner has confirmed it (whatsapp_verified)' }
            whatsapp_verified: { type: boolean, description: dashboard only }
            email: { type: [string, 'null'] }
            address: { type: [string, 'null'] }
            map_url: { type: [string, 'null'], description: https only }
        socials: { type: object, properties: { instagram: { type: [string, 'null'] }, facebook: { type: [string, 'null'] }, youtube: { type: [string, 'null'] }, google_maps: { type: [string, 'null'] } } }
        seo: { type: object, properties: { description: { type: [string, 'null'], maxLength: 160 }, description_hi: { type: [string, 'null'] } } }
    ContrastWarning:
      type: object
      description: Returned in meta.warnings; colours are still saved (the owner decides).
      properties:
        field: { type: string, enum: [primary_color, accent_color] }
        ratio: { type: number, example: 1.2 }
        required: { type: number, example: 4.5 }
        message: { type: string }
    GalleryItem:
      type: object
      properties:
        id: { type: integer }
        image: { $ref: '#/components/schemas/Image' }
        alt_text: { type: string }
        caption: { type: [string, 'null'] }
        category: { type: string, enum: [food, interior, events] }
        sort_order: { type: integer }
        is_demo: { type: boolean }
    CartLine:
      type: object
      required: [item_id, quantity]
      properties:
        item_id: { type: integer }
        variant_id: { type: [integer, 'null'], description: required when the dish has sizes }
        addon_ids: { type: array, items: { type: integer } }
        quantity: { type: integer, minimum: 1, maximum: 50 }
        notes: { type: [string, 'null'], maxLength: 200 }
    Quote:
      type: object
      properties:
        lines: { type: array, items: { type: object, description: 'menu_item_id, name, variant_name, addons[], unit_price, quantity, tax_rate, line_subtotal, line_tax, line_total' } }
        subtotal: { type: string }
        tax_total: { type: string }
        cgst: { type: string }
        sgst: { type: string }
        items_total: { type: string }
        packaging_fee: { type: string }
        delivery_fee: { type: string }
        total: { type: string }
        prices_include_tax: { type: boolean }
        zone: { type: [object, 'null'] }
        zone_error: { type: [object, 'null'], description: '{ message, code (outside_delivery_area | below_minimum), min_order? }' }
    CustomerOrder:
      type: object
      description: Tracking view (no staff notes or exact coordinates).
      properties:
        id: { type: string, description: public id }
        number: { type: integer, example: 1001 }
        type: { type: string, enum: [delivery, takeaway, dine_in] }
        status: { type: string, enum: [pending, confirmed, preparing, ready, out_for_delivery, completed, cancelled] }
        scheduled_for: { type: [string, 'null'], format: date-time }
        items: { type: array, items: { type: object } }
        total: { type: string }
        payment_method: { type: string, enum: [online, cod, counter] }
        payment_status: { type: string, enum: [unpaid, pending, paid, failed, refund_due, refunded] }
        timeline: { type: array, items: { type: object, properties: { status: { type: string }, at: { type: string } } } }
    AuthResult:
      type: object
      properties:
        token: { type: string }
        session: { $ref: '#/components/schemas/Session' }
    Staff:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        role: { type: string }
        status: { type: string, enum: [active, disabled] }
        last_login_at: { type: [string, 'null'], format: date-time }
security: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Sign up with email (onboarding step 1)
      description: 10 requests/hour per IP. The account's language comes from `X-Locale`.
      parameters: [{ $ref: '#/components/parameters/Locale' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, description: 8+ chars with letters and numbers }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '422': { description: Validation error }
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      description: 5 attempts/minute per email+IP.
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '403': { description: Account disabled (`account_disabled`) }
        '422': { description: Wrong credentials (`invalid_credentials`) }
  /auth/otp/send:
    post:
      tags: [Auth]
      summary: Send a 6-digit sign-in code to an Indian mobile
      description: Resend allowed after 60 s; 5/hour per number, 20/hour per IP. `dev_code` is only returned when APP_ENV=local and OTP_DEV_ECHO=true.
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [phone], properties: { phone: { type: string, example: '98290 12345' } } }
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  expires_in: { type: integer }
                  resend_in: { type: integer }
                  is_new: { type: boolean }
                  dev_code: { type: string }
        '429': { description: Too soon (`otp_wait`) or rate limited }
  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify the code; signs in, or signs up when `name` is given for a new number
      description: Codes expire after 10 minutes and lock after 5 wrong attempts. A code is consumed only on success. A new account gets the language in `X-Locale`.
      parameters: [{ $ref: '#/components/parameters/Locale' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, example: '482913' }
                name: { type: string, description: Required for new numbers }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '422': { description: '`otp_invalid` or `name_required`' }
        '429': { description: '`otp_locked`' }
  /auth/me:
    get:
      tags: [Auth]
      security: [{ bearer: [] }]
      summary: Current session (user, business, role, permissions, features, limits)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { description: Not signed in }
  /auth/logout:
    post:
      tags: [Auth]
      security: [{ bearer: [] }]
      summary: Revoke the current token (and the app-notification devices registered with it)
      responses:
        '200': { description: Signed out }
  /onboarding/business:
    post:
      tags: [Onboarding]
      security: [{ bearer: [] }]
      summary: Steps 2–3 — create the business
      description: Creates the tenant, a provisional subdomain `{slug}.{platform}`, a 14-day Growth trial, the owner role and opening hours, in one transaction.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [business_type, name, city, opening_hours]
              properties:
                business_type: { type: string, enum: [restaurant, cafe, cloud_kitchen, hotel] }
                name: { type: string }
                city: { type: string }
                gstin: { type: [string, 'null'], example: 08ABCDE1234F1Z5 }
                opening_hours: { $ref: '#/components/schemas/OpeningHours' }
                referral_code: { type: [string, 'null'], maxLength: 20, description: 'From the ?ref= sign-up link (see /referrals/{code}); invalid, demo, branch and own codes are ignored without an error' }
      responses:
        '201': { description: 'Created; returns the new session', content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '409': { description: Already has a business (`already_onboarded`) }
        '422': { description: Validation error }
  /onboarding/theme:
    put:
      tags: [Onboarding]
      security: [{ bearer: [] }]
      summary: Step 4 — choose the theme (owner)
      requestBody: { content: { application/json: { schema: { type: object, required: [theme], properties: { theme: { type: string, enum: [haveli, bistro, street] } } } } } }
      responses:
        '200': { description: 'Session (onboarding_step ≥ 5). Steps only move forward; earlier steps can be revisited.' }
  /onboarding/branding:
    put:
      tags: [Onboarding]
      security: [{ bearer: [] }]
      summary: Step 5 — colours and tagline (logo via /tenant/website/images/logo)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                primary_color: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
                accent_color: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
                tagline: { type: [string, 'null'], maxLength: 140 }
                tagline_hi: { type: [string, 'null'], maxLength: 140 }
      responses:
        '200': { description: 'Session (step ≥ 6); meta.warnings = ContrastWarning[]' }
  /onboarding/menu:
    post:
      tags: [Onboarding]
      security: [{ bearer: [] }]
      summary: Step 6 — start with a sample menu (flagged is_demo, shown as "Demo"), keep the dishes already imported, or skip
      description: '`imported`: the owner already added their own dishes (e.g. read from photos of their printed menu with the AI); needs at least one dish (audited `onboarding.menu_imported`).'
      requestBody: { content: { application/json: { schema: { type: object, required: [mode], properties: { mode: { type: string, enum: [sample, imported, skip] } } } } } }
      responses:
        '200': { description: Session (step ≥ 7). Idempotent; a sample is never added on top of an existing menu. }
        '422': { description: '`menu_empty` (errors.mode) for `imported` with no dishes' }
  /onboarding/subdomain:
    get:
      tags: [Onboarding]
      security: [{ bearer: [] }]
      summary: Step 7 — check a subdomain
      parameters: [{ name: slug, in: query, required: true, schema: { type: string } }]
      responses:
        '200':
          description: 'Rules: 3–40 chars, a–z 0–9 and single hyphens, not at the ends, not reserved, not taken (your own current slug is fine).'
          content: { application/json: { schema: { type: object, properties: { slug: { type: string }, host: { type: string }, available: { type: boolean }, message: { type: [string, 'null'] }, suggestion: { type: [string, 'null'] } } } } }
  /onboarding/go-live:
    post:
      tags: [Onboarding]
      security: [{ bearer: [] }]
      summary: Step 7 — set the subdomain and publish
      requestBody: { content: { application/json: { schema: { type: object, required: [slug], properties: { slug: { type: string } } } } } }
      responses:
        '200': { description: 'Session with status live, onboarding_step 8, next = dashboard. Audited (tenant.went_live, tenant.slug_changed).' }
        '409': { description: '`already_live` or `steps_incomplete`' }
        '422': { description: '`slug_unavailable` (errors.slug)' }
  /site:
    get:
      tags: [Public site]
      summary: Everything the public website needs for the business at this host
      parameters: [{ $ref: '#/components/parameters/TenantHost' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  business_type: { type: string }
                  city: { type: [string, 'null'] }
                  status: { type: string }
                  is_live: { type: boolean, description: Unpublished sites are shown to visitors as "coming soon" }
                  is_demo: { type: boolean }
                  timezone: { type: string }
                  theme: { $ref: '#/components/schemas/ThemeSettings' }
                  content: { $ref: '#/components/schemas/SiteContent' }
                  opening_hours: { $ref: '#/components/schemas/OpeningHours' }
                  holidays: { type: array, items: { $ref: '#/components/schemas/Holiday' }, description: upcoming closures (max 10) }
                  open_status:
                    type: [object, 'null']
                    properties:
                      is_open: { type: boolean }
                      closes_at: { type: [string, 'null'] }
                      opens_at: { type: [string, 'null'] }
                      today: { type: string }
                      timezone: { type: string }
                      holiday: { oneOf: [{ $ref: '#/components/schemas/Holiday' }, { type: 'null' }] }
                  has_menu: { type: boolean }
                  has_gallery: { type: boolean }
                  features: { type: object, properties: { online_ordering: { type: boolean }, reservations: { type: boolean } } }
                  seo:
                    type: object
                    properties:
                      title: { type: string }
                      description: { type: string, description: 'Owner SEO text, else tagline, else built from name/type/city' }
                      description_hi: { type: [string, 'null'] }
                      canonical: { type: string }
                      image: { type: [string, 'null'] }
                      indexable: { type: boolean, description: live and not demo }
        '404': { description: '`tenant_not_found` or `tenant_unavailable` (suspended)' }
  /site/menu:
    get:
      tags: [Public site]
      summary: Active categories with their dishes (empty categories omitted)
      parameters: [{ $ref: '#/components/parameters/TenantHost' }]
      responses:
        '200':
          description: 'Array of { id, name, name_hi, slug, is_demo, items[] }; item = { id, name, name_hi, description, description_hi, price ("280.00"), food_type (veg|non_veg|egg), spice_level 0–3, allergens[], is_available, is_bestseller, is_chefs_special, image (Image), is_demo }'
  /site/gallery:
    get:
      tags: [Public site]
