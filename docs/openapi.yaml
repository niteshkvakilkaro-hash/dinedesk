      summary: 'Send me a test now: today so far, to the owner, on the channels chosen (5 per hour per person)'
      responses:
        '200': { description: '{ channels: ["whatsapp" | "mail"] }' }
        '422': { description: '`no_channel`: the owner has no mobile number / email for the channels chosen' }
        '429': { description: Too many tests this hour }
  /tenant/referrals:
    get:
      tags: [Referrals]
      security: [{ bearer: [] }]
      summary: 'Billing → Refer a business (permission `billing.manage`; a branch shows its main business). Works while read-only'
      description: 'Both businesses get `reward_days` free days once, when the referred business makes its first subscription payment. Free days are added only where nothing renews on Razorpay (a trial, or a plan that will not renew); otherwise they wait as `pending` until they can be added or the super admin applies them. Other businesses: name and progress only.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean, description: false for demo businesses }
                  code: { type: [string, 'null'], example: K7MQ4XRP, description: '8 characters, no look-alikes (0 O 1 I); the sign-up link is ?ref=<code>' }
                  reward_days: { type: integer, example: 30 }
                  stats: { type: object, properties: { signed_up: { type: integer }, paying: { type: integer }, days_earned: { type: integer }, days_pending: { type: integer } } }
                  businesses: { type: array, maxItems: 50, items: { type: object, properties: { name: { type: string }, status: { type: string, enum: [signed_up, paying] }, joined_at: { type: string, format: date-time } } } }
                  rewards:
                    type: array
                    items:
                      type: object
                      properties:
                        role: { type: string, enum: [referrer, referred] }
                        days: { type: integer }
                        status: { type: string, enum: [pending, applied] }
                        applied_to: { type: [string, 'null'], enum: [trial, period, manual, null] }
                        applied_at: { type: [string, 'null'], format: date-time }
                        new_end: { type: [string, 'null'], format: date-time }
                        business: { type: [string, 'null'] }
                        created_at: { type: string, format: date-time }
                  referred_by: { type: [string, 'null'], description: name of the business that referred this one }
  /referrals/{code}:
    get:
      tags: [Referrals]
      summary: 'Sign-up page: "Invited by <business>" (name only; 20 per minute per IP)'
      description: 'The code is case-insensitive and may contain spaces / hyphens. Sign-up passes it on as `referral_code` in POST /onboarding/business; invalid, demo, branch and own codes are ignored there.'
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ name }' }
        '404': { description: '`not_found`: unknown, demo or suspended' }
        '429': { description: Too many tries }
