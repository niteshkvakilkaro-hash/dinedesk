      description: Events only say what changed (ids and status); screens refetch through the normal API. Each topic needs the matching permission.
      requestBody: { content: { application/json: { schema: { type: object, required: [socket_id, channel_name], properties: { socket_id: { type: string }, channel_name: { type: string, example: private-tenant.01HX….kitchen } } } } } }
      responses:
