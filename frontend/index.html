<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14110F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DineDesk</title>
    <meta name="description" content="DineDesk: websites, online ordering and restaurant management for Indian restaurants, cafes and hotels." />
    <script>
      // A business website starts fetching its data while the app downloads (saves a round trip).
      (function () {
        var d = '%VITE_PLATFORM_DOMAIN%', api = '%VITE_API_URL%', h = location.hostname;
        if (d.charAt(0) === '%') d = 'localhost';
        if (api.charAt(0) === '%') api = '';
        if ([d, 'app.' + d, 'www.' + d, '127.0.0.1'].indexOf(h) !== -1) return;
        window.__ddSite = fetch(api.replace(/\/$/, '') + '/api/v1/site', { headers: { Accept: 'application/json', 'X-Tenant-Host': location.host } })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
