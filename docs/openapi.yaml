      summary: 'Test with the saved keys (razorpay, ai: no body; whatsapp, sms: { phone }; mail: { email }; firebase: no body — signs in to Google, then sends a test notification to the admin''s own app devices, or says none are signed in). 5 a minute, 40 an hour'
      responses:
