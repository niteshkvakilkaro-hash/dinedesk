    post:
      tags: [Billing (owner)]
      security: [{ bearer: [] }]
      summary: 'Start a Razorpay subscription for a plan and cycle; returns what Razorpay Checkout needs'
      description: 'Still on a trial: the first charge is set for the end of the trial (Razorpay `start_at`), so no trial days are lost; once authorised the subscription is `scheduled` until then. An unfinished earlier checkout is replaced.'
      requestBody: { content: { application/json: { schema: { type: object, required: [plan, cycle], properties: { plan: { type: string }, cycle: { type: string, enum: [monthly, yearly] } } } } } }
      responses:
