  /site/orders/quote:
    post:
      tags: [Ordering (public)]
      summary: Live price for a cart (nothing saved)
      parameters: [{ $ref: '#/components/parameters/TenantHost' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [type, items]
              properties:
                type: { type: string, enum: [delivery, takeaway, dine_in] }
                pincode: { type: string, example: '400050' }
                lat: { type: number }
                lng: { type: number }
                items: { type: array, items: { $ref: '#/components/schemas/CartLine' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Quote' } } } }
        '422': { description: 'Unavailable dish / missing size / extras rules' }
  /site/orders:
    post:
      tags: [Ordering (public)]
      summary: Place an order (rate-limited per visitor and per phone)
      description: 'Checks: ordering switched on, type and payment method allowed, open now (or a valid scheduled time within hours and the window), delivery zone and minimum. Pay-later orders alert staff immediately; online orders once paid. The guest''s updates are sent in the `X-Locale` language.'
      parameters: [{ $ref: '#/components/parameters/TenantHost' }, { $ref: '#/components/parameters/Locale' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [type, payment_method, customer, items]
              properties:
                type: { type: string, enum: [delivery, takeaway, dine_in] }
                payment_method: { type: string, enum: [online, cod, counter] }
                scheduled_for: { type: [string, 'null'], format: date-time }
                customer: { type: object, properties: { name: { type: string }, phone: { type: [string, 'null'], example: '9876543210', description: 'Optional with table_token' }, email: { type: [string, 'null'] } } }
                table_token: { type: [string, 'null'], description: 'From the table QR (/t/{token}): dine-in on the running bill of that table' }
                address: { type: [object, 'null'], properties: { line1: { type: string }, line2: { type: string }, landmark: { type: string }, pincode: { type: string }, lat: { type: number }, lng: { type: number } } }
                notes: { type: [string, 'null'] }
                items: { type: array, items: { $ref: '#/components/schemas/CartLine' } }
      responses:
        '201':
          description: 'Created. token = private tracking token. razorpay (online only) = { key_id, order_id, amount (paise), currency, name, description, prefill } for Razorpay Checkout.'
          content: { application/json: { schema: { type: object, properties: { order: { $ref: '#/components/schemas/CustomerOrder' }, token: { type: string }, razorpay: { type: [object, 'null'] } } } } }
        '422': { description: Validation or an ordering rule (see codes above) }
        '429': { description: Too many orders }
  /site/orders/{id}:
    get:
      tags: [Ordering (public)]
      summary: Track an order (needs the private token)
      description: 'While the order is out_for_delivery and its rider sent a position in the last 30 minutes, `rider` = { name_first, lat, lng, at } (first name and last position only: no phone, no route, no other riders); otherwise null.'
      parameters:
        - { $ref: '#/components/parameters/TenantHost' }
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: t, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerOrder' } } } }
        '404': { description: 'Unknown order, wrong token or another business' }
  /site/orders/{id}/payment:
    post:
      tags: [Ordering (public)]
      summary: Razorpay Checkout success — accepted only with a valid signature
      description: 'HMAC-SHA256(razorpay_order_id|razorpay_payment_id, key_secret) must equal razorpay_signature. Idempotent with the webhook.'
      parameters:
        - { $ref: '#/components/parameters/TenantHost' }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody: { content: { application/json: { schema: { type: object, required: [t, razorpay_order_id, razorpay_payment_id, razorpay_signature], properties: { t: { type: string }, razorpay_order_id: { type: string }, razorpay_payment_id: { type: string }, razorpay_signature: { type: string } } } } } }
      responses:
        '200': { description: Paid }
        '422': { description: '`payment_unverified`' }
  /webhooks/razorpay/{tenant}:
    post:
      tags: [Ordering (public)]
      summary: Razorpay webhook for one business (tenant public id in the path)
      description: 'X-Razorpay-Signature = HMAC-SHA256(raw body, webhook_secret). Handles payment.captured, order.paid, payment.failed; repeats are harmless. A payment arriving after the order was released marks it refund_due.'
      parameters: [{ name: tenant, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Accepted (or ignored for unknown orders) }
        '400': { description: Invalid signature }
  /tenant/orders:
    get:
      tags: [Orders (dashboard)]
      security: [{ bearer: [] }]
      summary: Orders list (orders.view)
      parameters:
        - { name: view, in: query, schema: { type: string, enum: [active, scheduled, completed, cancelled, all] }, description: 'active = paid or pay-later, not finished, not scheduled more than 2 h ahead' }
        - { name: type, in: query, schema: { type: string, enum: [delivery, takeaway, dine_in] } }
        - { name: date, in: query, schema: { type: string, format: date }, description: business timezone }
        - { name: search, in: query, schema: { type: string }, description: 'order number, name or phone' }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200': { description: 'Paginated rows; meta.counts = { pending, in_kitchen, ready, scheduled }' }
  /tenant/orders/feed:
    get:
      tags: [Orders (dashboard)]
      security: [{ bearer: [] }]
      summary: Polled by the dashboard for the new-order chime
      parameters: [{ name: after, in: query, schema: { type: integer }, description: last order id seen }]
      responses:
        '200': { description: '{ latest_id, new[], counts, unread }' }
  /tenant/orders/{id}:
    get:
      tags: [Orders (dashboard)]
      security: [{ bearer: [] }]
      summary: Order detail with contact, address, events and allowed next statuses
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK }
        '404': { description: Not in your business }
  /tenant/orders/{id}/status:
    post:
      tags: [Orders (dashboard)]
      security: [{ bearer: [] }]
      summary: Move an order on (orders.manage)
      description: 'pending → confirmed → preparing → ready → (out_for_delivery, delivery only) → completed; cancel from any open state with a reason (audited; paid online → refund_due). Pay-later orders are marked paid on completion. Unpaid online orders can only be cancelled.'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string }, note: { type: [string, 'null'] } } } } } }
      responses:
        '200': { description: Updated order }
        '422': { description: '`invalid_transition`, `awaiting_payment`, `reason_required`' }
  /tenant/riders:
    get:
      tags: [Riders (dashboard)]
      security: [{ bearer: [] }]
      summary: Delivery riders with duty, last position and active orders, plus delivery orders waiting for a rider (orders.manage)
      responses:
        '200': { description: '{ riders: [{ id, name, phone, on_duty, duty_started_at, last: { lat, lng, accuracy_m, battery, at } | null, orders: [{ id, number, status, customer_name, address, lat, lng, total, payment_method, placed_at }] }], unassigned: [same order shape] }; meta { interval_sec, stale_minutes }' }
        '403': { description: 'forbidden (needs orders.manage)' }
  /tenant/riders/{id}/trail:
    get:
      tags: [Riders (dashboard)]
      security: [{ bearer: [] }]
      summary: One rider's route for a day, oldest first (default today in the business timezone; at most 3000 points)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: '{ rider_id, date, points: [{ lat, lng, at }] }' }
        '422': { description: '`not_a_rider` (not a rider of this business)' }
  /tenant/orders/{id}/rider:
    post:
      tags: [Riders (dashboard)]
      security: [{ bearer: [] }]
      summary: Give a delivery order to a rider, or take it back with rider_id null (orders.manage)
      description: 'The rider gets a push alert in their language (lang staff.rider.*). Logged on the order (rider_assigned / rider_unassigned) and audited.'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [rider_id], properties: { rider_id: { type: [integer, 'null'] } } } } } }
      responses:
        '200': { description: 'Order detail (as GET /tenant/orders/{id}, with rider: { id, name, assigned_at })' }
        '422': { description: '`not_a_rider` (other business, other role, disabled), `not_delivery`, `order_closed`' }
  /tenant/rider:
    get:
      tags: [Rider (phone)]
      security: [{ bearer: [] }]
      summary: The rider's own screen (deliveries.run)
      responses:
        '200': { description: '{ on_duty, duty_started_at, last_sent_at, interval_sec, orders: [{ id, number, status, customer_name, customer_phone, address { line1, line2, landmark, pincode, lat, lng }, notes, items_count, total, payment_method, payment_status, collect (cash to collect or null), placed_at, scheduled_for, next: out_for_delivery | completed | null }] } (only orders given to this rider)' }
  /tenant/rider/duty:
    post:
      tags: [Rider (phone)]
      security: [{ bearer: [] }]
      summary: Start or end duty (location is stored only while on duty)
      description: 'on=true also returns sharing = { token, expires_at, interval_sec }: an upload-only token for the Android app''s background location service (rejected on every other route; a new one replaces the old at each duty start). A duty ends by itself after dinedesk.riders.max_duty_hours (14).'
      requestBody: { content: { application/json: { schema: { type: object, required: [on], properties: { on: { type: boolean } } } } } }
      responses:
        '200': { description: 'Same as GET /tenant/rider + sharing (null when going off duty)' }
  /tenant/rider/orders/{id}/status:
    post:
      tags: [Rider (phone)]
      security: [{ bearer: [] }]
      summary: Picked up (out_for_delivery, from ready) or delivered (completed), own orders only
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [out_for_delivery, completed] } } } } } }
      responses:
        '200': { description: Same as GET /tenant/rider }
        '404': { description: Not this rider's order }
        '422': { description: '`invalid_transition` (e.g. still being prepared), `awaiting_payment`' }
  /tenant/rider/locations:
    post:
      tags: [Rider (phone)]
      security: [{ bearer: [] }]
      summary: A batch of positions (every dinedesk.riders.location_interval seconds, 300 by default; points queued offline may come together)
      description: |
        Used by the rider screen in the browser and by the Android app's foreground service. Headers:
        Authorization: Bearer <token> (the session token, or the upload token from POST /tenant/rider/duty),
        Accept: application/json, Content-Type: application/json, X-Tenant-Host, X-Locale.
        Only points taken during one of the rider's duties (last 24 h) are kept; a point sent twice is
        stored once. Throttled to 12 requests per minute per rider. Points are deleted after
        dinedesk.riders.retention_days (7) by the daily riders:purge-locations.
        Client handling: 200 drop the sent points (stop when on_duty is false, follow interval_sec);
        401/403 stop; 409 not_on_duty drop the queue and stop; 422 drop that batch; 429/5xx/offline keep and retry.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [lat, lng, recorded_at]
                    properties:
                      lat: { type: number, minimum: -90, maximum: 90 }
                      lng: { type: number, minimum: -180, maximum: 180 }
                      accuracy_m: { type: [number, 'null'], minimum: 0 }
                      speed: { type: [number, 'null'], description: metres per second }
                      heading: { type: [number, 'null'], minimum: 0, maximum: 360 }
                      battery: { type: [number, 'null'], minimum: 0, maximum: 100 }
                      recorded_at: { type: string, format: date-time, description: 'not more than 2 min in the future, not older than 24 h' }
      responses:
        '200': { description: '{ accepted, on_duty, interval_sec }' }
        '409': { description: '`not_on_duty` (no point fell inside a duty and the rider is off duty)' }
        '422': { description: Validation (ranges, times, 1–50 points) }
        '429': { description: Too many uploads }
