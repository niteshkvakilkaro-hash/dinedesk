    post:
      tags: [Reservations (public)]
      summary: Guest cancels (pending or confirmed, before the time)
      parameters: [{ $ref: '#/components/parameters/TenantHost' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [code, phone], properties: { code: { type: string }, phone: { type: string } } } } } }
      responses:
        '200': { description: Cancelled booking }
        '422': { description: '`not_cancellable`' }
