  /tenant/bills:
    get:
      tags: [POS (dashboard)]
      security: [{ bearer: [] }]
      summary: Bills issued on a business date
      parameters: [{ name: date, in: query, schema: { type: string, format: date } }]
      responses:
        '200': { description: OK }
    post:
      tags: [POS (dashboard)]
      security: [{ bearer: [] }]
      summary: Make a GST bill for orders or a table (numbered INV/2026-27/0001 per financial year)
      description: 'Lines come from the orders. A discount (percent or amount, reason required, audited) is taken off the taxable value and shared across lines; GST is recalculated per line (CGST + SGST); the total is rounded to the rupee. With the business GSTIN it is a Tax invoice, otherwise a Bill. Orders already paid online count as paid.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id: { type: [integer, 'null'], description: Bill a whole table }
                order_ids: { type: [array, 'null'], items: { type: integer } }
                discount: { type: [object, 'null'], properties: { type: { type: string, enum: [percent, amount] }, value: { type: number }, reason: { type: string } } }
                buyer: { type: [object, 'null'], properties: { name: { type: string }, phone: { type: string }, gstin: { type: string } } }
      responses:
        '201': { description: 'Bill (lines, taxable value, CGST, SGST, charges, round off, total, payments, amount in words)' }
        '422': { description: '`nothing_to_bill` / `already_billed` / `reason_required` / `discount_too_large`' }
