      requestBody: { content: { application/json: { schema: { type: object, required: [razorpay_payment_id, razorpay_subscription_id, razorpay_signature], properties: { razorpay_payment_id: { type: string }, razorpay_subscription_id: { type: string }, razorpay_signature: { type: string } } } } } }
      responses:
