      security: [{ bearer: [] }]
      summary: Staff order (POS or waiter app) — confirmed and sent to the kitchen; dine-in joins the table's running bill
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [type, source, items]
              properties:
                type: { type: string, enum: [dine_in, takeaway] }
                source: { type: string, enum: [pos, waiter] }
                dining_table_id: { type: [integer, 'null'], description: Required for dine-in }
