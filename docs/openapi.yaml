  /platform/integrations:
    get:
      tags: [Platform (super admin)]
      security: [{ bearer: [] }]
      summary: 'Integration keys (razorpay, ai, whatsapp, sms, messaging, mail, webpush, firebase): per field { source: saved|env|unset, updated_at } plus value (plain fields) or { set, last4 } (secrets, never the value); ready flags, firebase { project_id, client_email } of the key in use (or null), mailer, Razorpay webhook URL and events'
      responses:
        '200': { description: OK }
  /platform/integrations/{integration}:
    put:
      tags: [Platform (super admin)]
      security: [{ bearer: [] }]
      summary: 'Save one integration (razorpay, ai, whatsapp, sms, messaging, mail, firebase — values.credentials = the service-account key JSON, checked and stored encrypted with only project_id, client_email and private_key). An empty secret keeps the saved one, an empty plain field falls back to .env, remove[] clears saved values. current_password is required when a secret is set or removed. Audited by field name'
      requestBody: { content: { application/json: { schema: { type: object, required: [values], properties: { values: { type: object }, remove: { type: array, items: { type: string } }, current_password: { type: string } } } } } }
      responses:
        '200': { description: Same shape as GET /platform/integrations }
