plugins {
    id 'com.android.application'
}

/*
 * One app, DineDesk, for guests and businesses. It opens <platform host>/app and stays inside the
 * platform host and its business subdomains.
 *
 *   dev   http://<pc-ip>:<port>/app, the dev server on this PC (phone on the same Wi-Fi; businesses
 *         are <slug>.<pc-ip>.nip.io). -PdevHost=192.168.1.42 -PdevPort=5180 (build-local.ps1 sets them).
 *   prod  https://<platformHost>/app.  -PplatformHost=dinedesk.in, signed with the upload key from
 *         upload-keystore.properties (both required for a prod build; see android/README.md).
 */
def devHost = (project.findProperty('devHost') ?: '').toString().trim()
def devPort = (project.findProperty('devPort') ?: '5180').toString().trim()
def platformHost = (project.findProperty('platformHost') ?: '').toString().trim().toLowerCase().replaceAll('^https?://', '').replaceAll('/.*$', '')
def appVersionCode = (project.findProperty('versionCode') ?: '4').toString().toInteger()
def appVersionName = (project.findProperty('versionName') ?: '1.3').toString()

/*
 * App notifications (Firebase Cloud Messaging) without the google-services Gradle plugin: when
 * app/google-services.json exists (git-ignored; Firebase console → Project settings → Your apps),
 * the client for each flavor's applicationId becomes BuildConfig.FCM_* and Push.java starts Firebase
 * with it. No file, or no client for that id: FCM_ENABLED = false and the app builds and runs with
 * notifications off.
 */
def fcmConfig = { String appId ->
    def off = [enabled: false, projectId: '', appId: '', apiKey: '', senderId: '']
    def f = file('google-services.json')
    if (!f.exists()) return off
    try {
        def json = new groovy.json.JsonSlurper().parse(f)
        def client = json.client?.find { it?.client_info?.android_client_info?.package_name == appId }
        if (!client) {
            logger.warn("google-services.json has no Android app for ${appId}: notifications are off in this build.")
            return off
        }
        def clean = { v -> (v ?: '').toString().replaceAll('[^A-Za-z0-9:._-]', '') }
        def c = [
            enabled: true,
            projectId: clean(json.project_info?.project_id),
            appId: clean(client.client_info?.mobilesdk_app_id),
            apiKey: clean(client.api_key?.find { it?.current_key }?.current_key),
            senderId: clean(json.project_info?.project_number),
        ]
        if (!c.projectId || !c.appId || !c.apiKey || !c.senderId) {
            logger.warn("google-services.json is missing values for ${appId}: notifications are off in this build.")
            return off
        }
        return c
    } catch (Exception e) {
        logger.warn("google-services.json could not be read (${e.message}): notifications are off in this build.")
        return off
    }
}
def fcmFields = { flavor, String appId ->
    def c = fcmConfig(appId)
    flavor.buildConfigField 'boolean', 'FCM_ENABLED', c.enabled.toString()
    flavor.buildConfigField 'String', 'FCM_PROJECT_ID', "\"${c.projectId}\""
    flavor.buildConfigField 'String', 'FCM_APP_ID', "\"${c.appId}\""
    flavor.buildConfigField 'String', 'FCM_API_KEY', "\"${c.apiKey}\""
    flavor.buildConfigField 'String', 'FCM_SENDER_ID', "\"${c.senderId}\""
    flavor.manifestPlaceholders.put('fcmEnabled', c.enabled.toString())
}

def props = { String name ->
    def p = new Properties()
    def f = rootProject.file(name)
    if (f.exists()) f.withInputStream { p.load(it) }
    p
}
// Local test key (made by build-local.ps1) and the Play upload key: both git-ignored.
def localKey = props('keystore.properties')
def uploadKey = props('upload-keystore.properties')

// Dev: plain http only to this PC (its IP, nip.io names for business subdomains, localhost).
def devNscDir = layout.buildDirectory.dir('generated/devNetworkConfig').get().asFile
if (devHost) {
    def xml = new File(devNscDir, 'xml/network_security_config.xml')
    xml.parentFile.mkdirs()
    xml.text = """<?xml version="1.0" encoding="utf-8"?>
<!-- Generated by app/build.gradle for the dev build: http only to the dev PC. -->
<network-security-config>
    <base-config cleartextTrafficPermitted="false" />
    <domain-config cleartextTrafficPermitted="true">
        <domain includeSubdomains="false">${devHost}</domain>
        <domain includeSubdomains="true">nip.io</domain>
        <domain includeSubdomains="true">localhost</domain>
    </domain-config>
</network-security-config>
"""
}

android {
    namespace 'com.dinedesk.app'
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        resValue 'string', 'app_name', 'DineDesk'
    }

    signingConfigs {
        local {
            if (localKey['storeFile']) {
                storeFile file(localKey['storeFile'])
                storePassword localKey['storePassword']
                keyAlias localKey['keyAlias']
                keyPassword localKey['keyPassword']
            }
        }
        upload {
            if (uploadKey['storeFile']) {
                storeFile file(uploadKey['storeFile'])
                storePassword uploadKey['storePassword']
                keyAlias uploadKey['keyAlias']
                keyPassword uploadKey['keyPassword']
            }
        }
    }

    flavorDimensions = ['env']
    productFlavors {
        dev {
            dimension 'env'
            // The id of the earlier local "DineDesk" test app, so it updates in place on test phones.
            applicationId 'com.dinedesk.admin.local'
            versionNameSuffix '-local'
            buildConfigField 'String', 'START_URL', "\"http://${devHost}:${devPort}/app\""
            // Hosts that open inside the app, each with its subdomains.
            buildConfigField 'String', 'APP_HOSTS', "\"${devHost},${devHost}.nip.io\""
            buildConfigField 'boolean', 'DEV', 'true'
            manifestPlaceholders = [usesCleartext: 'true']
            fcmFields(delegate, 'com.dinedesk.admin.local')
            signingConfig localKey['storeFile'] ? signingConfigs.local : signingConfigs.debug
        }
        prod {
            dimension 'env'
            // Permanent on the Play Store: never change it once published.
            applicationId 'in.dinedesk.app'
            buildConfigField 'String', 'START_URL', "\"https://${platformHost}/app\""
            buildConfigField 'String', 'APP_HOSTS', "\"${platformHost}\""
            buildConfigField 'boolean', 'DEV', 'false'
            manifestPlaceholders = [usesCleartext: 'false']
            fcmFields(delegate, 'in.dinedesk.app')
            if (uploadKey['storeFile']) signingConfig signingConfigs.upload
        }
    }

    sourceSets {
        dev { res.srcDirs += devNscDir }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
        resValues true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // App notifications (Push.java, PushService.java). Firebase is started by hand: no google-services plugin.
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}

// Clear messages instead of an app that opens nothing.
gradle.taskGraph.whenReady { graph ->
    def tasks = graph.allTasks.findAll { it.project == project }
    if (tasks.any { it.name.contains('Prod') }) {
        if (!platformHost) throw new GradleException('Production build: pass the platform domain, e.g. -PplatformHost=dinedesk.in (the app opens https://<it>/app).')
        if (tasks.any { it.name.contains('ProdRelease') } && !uploadKey['storeFile'])
            throw new GradleException('Production build: create webview-app/upload-keystore.properties (storeFile, storePassword, keyAlias, keyPassword) for the Play upload key.')
    }
    if (tasks.any { it.name.contains('Dev') } && !devHost)
        throw new GradleException('Dev build: pass this PC\'s Wi-Fi IP, e.g. -PdevHost=192.168.1.42 (build-local.ps1 does it).')
}
