      requestBody: { content: { application/json: { schema: { type: object, required: [code, phone], properties: { code: { type: string, example: 'K7M2QP' }, phone: { type: string } } } } } }
      responses:
        '200': { description: Booking }
        '404': { description: 'Same answer for a wrong ID or a wrong phone' }
