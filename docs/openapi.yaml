      tags: [Platform (super admin)]
      security: [{ bearer: [] }]
      summary: Plans with the feature catalogue and limit keys
      responses: { '200': { description: OK } }
  /platform/plans/{code}:
    parameters: [{ name: code, in: path, required: true, schema: { type: string, enum: [starter, growth, pro] } }]
    put:
      tags: [Platform (super admin)]
      security: [{ bearer: [] }]
      summary: Edit prices, features, limits (null = unlimited), availability
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: [string, 'null'] }
                price_monthly: { type: [number, 'null'] }
                price_yearly: { type: [number, 'null'] }
                features: { type: array, items: { type: string } }
                limits: { type: object, additionalProperties: { type: [integer, 'null'] } }
                is_active: { type: boolean }
      responses: { '200': { description: Saved } }
  /tenant/translations:
    get:
      tags: [Menu (dashboard)]
      security: [{ bearer: [] }]
      summary: 'Menu → Languages: the owner''s own texts with their translation in one site language (permission `menu.manage`)'
      description: 'Menu sections, dishes, sizes, add-on groups and add-ons, in menu order; room types (feature `hotel` + `rooms.setup`), offer banners (feature `coupons` + `marketing.manage`) and website text — tagline, about, milestones, search description (feature `website` + `theme.manage`) only for people who may edit those. English and Hindi are edited in the normal editors, so `lang` is one of the other ten.'
      parameters:
        - { name: lang, in: query, required: true, schema: { type: string, enum: [bn, mr, te, ta, gu, ur, kn, or, ml, pa] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  lang: { type: string }
                  entries: { type: array, items: { $ref: '#/components/schemas/TranslationEntry' } }
        '422': { description: Unknown `lang` }
    put:
      tags: [Menu (dashboard)]
      security: [{ bearer: [] }]
      summary: Save translations (an empty text removes that translation)
      description: 'Only keys this person may translate are accepted; each text is limited to its entry''s `max`. Audited (`menu.translations_saved`) when something changed.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [lang, values]
              properties:
                lang: { type: string, enum: [bn, mr, te, ta, gu, ur, kn, or, ml, pa] }
                values: { type: object, maxProperties: 2000, additionalProperties: { type: [string, 'null'] }, example: { 'item:12:name': 'পনির টিক্কা', 'item:12:description': '' } }
      responses:
        '200': { description: 'Saved; the same body as GET (lang, entries)' }
        '422': { description: 'Unknown key, or too long (`errors["values.<key>"]`)' }
  /tenant/translations/ai:
    post:
      tags: [Menu (dashboard)]
      security: [{ bearer: [] }]
      summary: AI drafts for the owner to check; nothing is saved (save them with PUT /tenant/translations)
      description: 'Rate limited (`ai`). Brand names, numbers and prices are kept; dish names are written as they are said. Keys the AI did not return are simply missing from `suggestions`.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [lang, keys]
              properties:
                lang: { type: string, enum: [bn, mr, te, ta, gu, ur, kn, or, ml, pa] }
                keys: { type: array, minItems: 1, maxItems: 120, items: { type: string, maxLength: 60 }, description: distinct entry keys }
      responses:
        '200': { description: '{ suggestions: { "<key>": "<text>" } }' }
        '422': { description: '`nothing_to_translate`, `ai_refused`, `ai_too_long` or validation' }
        '502': { description: '`ai_failed`' }
        '503': { description: '`ai_not_configured` (no ANTHROPIC_API_KEY on the server)' }
