      summary: Add a delivery zone (by pincodes or radius km from the restaurant location)
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string }, type: { type: string, enum: [pincode, radius] }, pincodes: { type: array, items: { type: string } }, radius_km: { type: number }, fee: { type: number }, min_order: { type: number }, free_above: { type: [number, 'null'] }, is_active: { type: boolean } } } } } }
      responses:
        '201': { description: Created }
  /tenant/ordering/zones/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Orders (dashboard)]
      security: [{ bearer: [] }]
      summary: Edit a zone
      responses:
        '200': { description: Saved }
    delete:
      tags: [Orders (dashboard)]
      security: [{ bearer: [] }]
      summary: Delete a zone
      responses:
        '200': { description: Deleted }
