      summary: CSV import — dry_run=1 validates every row, dry_run=0 imports all or nothing
      requestBody: { content: { multipart/form-data: { schema: { type: object, required: [file, dry_run], properties: { file: { type: string, format: binary }, dry_run: { type: boolean } } } } } }
      responses:
        '200': { description: 'dry run: { valid, rows, new_categories[], errors[{ row, messages[] }], preview[] }; import: menu + meta.imported' }
