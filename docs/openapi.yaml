      parameters:
        - { $ref: '#/components/parameters/TenantHost' }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: party_size, in: query, required: true, schema: { type: integer } }
      responses:
        '200': { description: '{ date, problem: null | { code: past|too_far|blackout|holiday, message }, slots: [{ time: "19:30", available }] }' }
        '422': { description: '`not_accepting` (online booking off) or party size outside the limits' }
  /site/reservations:
    post:
      tags: [Reservations (public)]
      summary: Book a table (pending until staff confirm, or confirmed straight away with auto-confirm)
      description: Rate limited per visitor and per phone. The smallest free table that fits is held when the business has tables. The guest's updates are sent in the `X-Locale` language.
      parameters: [{ $ref: '#/components/parameters/TenantHost' }, { $ref: '#/components/parameters/Locale' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [date, time, party_size, name, phone]
              properties:
                date: { type: string, format: date }
                time: { type: string, example: '19:30' }
                party_size: { type: integer, example: 4 }
                name: { type: string }
                phone: { type: string, example: '9876543210' }
                email: { type: [string, 'null'] }
                notes: { type: [string, 'null'] }
      responses:
        '201': { description: '{ code, status, date, time, party_size, starts_at, cancellable }' }
        '422': { description: '`full` / `no_table` / `too_soon` / `invalid_time` / `party_size` / date problems' }
