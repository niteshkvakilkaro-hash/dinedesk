      summary: Whole menu incl. hidden sections and sold-out dishes (menu.manage)
      responses:
        '200': { description: '{ categories[ { …, items[] } ], addon_groups[] }; meta = { items_count, items_limit, has_demo, allergens }' }
  /tenant/menu/categories:
    post:
      tags: [Menu (dashboard)]
      security: [{ bearer: [] }]
      summary: 'Add a section { name, name_hi, tax_rate (null = business default), is_active }'
