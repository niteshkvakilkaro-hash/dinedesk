      security: [{ bearer: [] }]
      summary: 'Save settings: accepting_orders, types, payments, default_tax_rate (0/5/12/18/28), prices_include_tax, packaging_fee, prep/delivery minutes, scheduling, location, notifications'
      responses:
        '200': { description: Saved (audited) }
  /tenant/ordering/razorpay:
