      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { type: object, properties: { enabled: { type: boolean, description: off by default }, whatsapp: { type: boolean }, email: { type: boolean }, hour: { type: integer, enum: [7, 8, 9, 10, 11] } } }
                  hours: { type: array, items: { type: integer }, example: [7, 8, 9, 10, 11] }
                  timezone: { type: string, example: Asia/Kolkata }
                  last_sent_on: { type: [string, 'null'], format: date, description: business-local date }
                  owner: { type: [object, 'null'], description: '{ name, phone, email, locale } — who receives it, in their dashboard language (for a branch: the main business''s owner)' }
                  preview: { type: string, description: 'Tomorrow''s message from yesterday''s real numbers' }
    put:
      tags: [Reports (dashboard)]
      security: [{ bearer: [] }]
      summary: Save the summary settings (audited `daily_summary.updated`)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [enabled, whatsapp, email, hour]
              properties:
                enabled: { type: boolean }
                whatsapp: { type: boolean }
                email: { type: boolean }
                hour: { type: integer, enum: [7, 8, 9, 10, 11], description: business-local hour }
      responses:
        '200': { description: 'Saved; the same body as GET' }
        '422': { description: 'Validation; switched on with neither WhatsApp nor email (`errors.whatsapp`)' }
